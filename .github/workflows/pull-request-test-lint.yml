name: Test & Lint

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  test-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.actor, 'dependabot') }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check TypeScript
        run: yarn typecheck

      - name: Run tests
        run: yarn test

      - name: Run lint
        run: yarn lint

      - name: Build for Lighthouse
        run: yarn build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: bt0uf0q0
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2024-01-01"
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Lighthouse CI (desktop)
        run: |
          yarn start &
          npx wait-on http://localhost:3000 --timeout 30000
          yarn lhci

      - name: Run Lighthouse CI (mobile)
        run: npx lhci autorun --config=.lighthouserc.mobile.json

      - name: Install Playwright browsers
        run: yarn playwright install chromium --with-deps

      - name: Run E2E tests
        # Reuses the production server already started for Lighthouse above
        # (playwright.config.ts's webServer is undefined in CI for this reason).
        run: yarn e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Auto-merge PR
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --auto (rather than an immediate merge) is required here: this step
        # runs as part of the very job whose completion is the required status
        # check, so at this point in time that check is still in_progress from
        # GitHub'"'"'s point of view and an immediate merge is always rejected by
        # branch protection ("the base branch policy prohibits the merge").
        # --auto instead just arms auto-merge, which GitHub completes itself
        # once this job reports success a few seconds later.
        # continue-on-error keeps a merge-side hiccup (e.g. auto-merge disabled
        # at the repo level) from failing this job and therefore the required
        # check itself, now that the actual code checks above already passed.
        run: gh pr merge --squash --auto --delete-branch "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
